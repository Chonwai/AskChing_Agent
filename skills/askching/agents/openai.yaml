interface:
  display_name: "AskChing"
  short_description: "Run cited multi-subgraph market research"
  default_prompt: "Use $askching to compare USDC supply APY across supported protocols with citations."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "askching"
      description: "AskChing MCP server for cited multi-subgraph market research"
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "@askching/mcp-server"
      # ⚠️ ESC-VPW-002：Codex 的 dependencies.tools 若需 streamable_http 形式，
      # 請改用 transport: "streamable_http" + url（見 docs/cross-platform.md §4）。
      # 此處保留 stdio + command/args 作為 intended block，需在 Codex 實測驗證。
